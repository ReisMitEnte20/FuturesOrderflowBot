# Logstash Pipeline Configuration for FuturesOrderflowBot

input {
  # Receive from Filebeat
  beats {
    port => 5044
    codec => "json"
  }
}

filter {
  # Parse and enrich event data
  if [type] == "log" or ![type] {
    # Parse JSON structured logs
    json {
      source => "message"
      target => "log_data"
      remove_field => "message"
    }

    # Add timestamp if not present
    if ![timestamp] {
      mutate {
        add_field => { "[@timestamp]" => "%{@timestamp}" }
      }
    }

    # Route by event type
    if [log_data][event_type] {
      mutate {
        add_field => { "[log][event_type]" => "%{[log_data][event_type]}" }
        add_field => { "[log][severity]" => "%{[log_data][severity]}" }
      }

      # Create separate indices by component
      if [fields][component] {
        mutate {
          add_field => { "[log][component]" => "%{[fields][component]}" }
        }
      }

      # Flatten critical fields for easier querying
      mutate {
        add_field => { "event_type" => "%{[log_data][event_type]}" }
        add_field => { "component" => "%{[fields][component]}" }
        add_field => { "severity" => "%{[log_data][severity]}" }
      }
    }

    # Remove noisy fields
    mutate {
      remove_field => [ "agent", "host", "ecs" ]
    }
  }
}

output {
  # Send to Elasticsearch with dynamic index naming
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "tradingbot-%{component}-%{+YYYY.MM.dd}"
    document_type => "%{event_type}"
    codec => "json"
  }

  # Console output for debugging (optional)
  if [@metadata][pipeline] == "debug" {
    stdout {
      codec => "rubydebug"
    }
  }
}
