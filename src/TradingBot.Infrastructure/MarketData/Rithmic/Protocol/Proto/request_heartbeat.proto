syntax = "proto3";

package rti;

option csharp_namespace = "TradingBot.Infrastructure.MarketData.Rithmic.Protocol.Messages";

message RequestHeartbeat {
  int32 template_id = 154467;
  repeated string user_msg = 132760;
  int32 ssboe = 150100;
  int32 usecs = 150101;
}
