// Rekonstruiert aus dem Protobuf-Deskriptor von async_rithmic 1.6.6 (MIT, (c) 2024 Mickael Burguet): request_market_data_update.proto
syntax = "proto3";

package rti;

option csharp_namespace = "TradingBot.Infrastructure.MarketData.Rithmic.Protocol.Messages";

message RequestMarketDataUpdate {
  enum UpdateBits {
    UPDATEBITS_UNSPECIFIED = 0;
    LAST_TRADE = 1;
    BBO = 2;
    ORDER_BOOK = 4;
    OPEN = 8;
    OPENING_INDICATOR = 16;
    HIGH_LOW = 32;
    HIGH_BID_LOW_ASK = 64;
    CLOSE = 128;
    CLOSING_INDICATOR = 256;
    SETTLEMENT = 512;
    MARKET_MODE = 1024;
    OPEN_INTEREST = 2048;
    MARGIN_RATE = 4096;
    HIGH_PRICE_LIMIT = 8192;
    LOW_PRICE_LIMIT = 16384;
    PROJECTED_SETTLEMENT = 32768;
    ADJUSTED_CLOSE = 65536;
  }
  enum Request {
    REQUEST_UNSPECIFIED = 0;
    SUBSCRIBE = 1;
    UNSUBSCRIBE = 2;
  }
  int32 template_id = 154467;
  repeated string user_msg = 132760;
  string symbol = 110100;
  string exchange = 110101;
  RequestMarketDataUpdate.Request request = 100000;
  uint32 update_bits = 154211;
}
